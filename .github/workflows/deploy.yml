name: Deploy GreenOS to Contabo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Contabo VPS
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" << 'EOF'
          set -e
          cd /root/GreenLogistics-Attendance
          git fetch origin
          git reset --hard origin/main
          npm ci

          # Pick schema from DATABASE_URL in .env (Prisma also loads .env itself)
          DB_URL="$(grep -E '^DATABASE_URL=' .env | head -n1 | cut -d= -f2- | tr -d '"' | tr -d "'")"
          if echo "$DB_URL" | grep -qiE '^postgres(ql)?://'; then
            SCHEMA="prisma/schema.postgresql.prisma"
          else
            SCHEMA="prisma/schema.prisma"
          fi
          echo "Using Prisma schema: $SCHEMA"

          npx prisma generate --schema="$SCHEMA"
          npx prisma db push --schema="$SCHEMA"
          npm run build
          pm2 restart greenos
          pm2 save
          sleep 5
          curl --fail http://localhost:3847/api/health
          EOF
