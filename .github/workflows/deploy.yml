name: Deploy GreenOS to Contabo

on:
  push:
    branches:
      - main
  # Manual trigger when push events fail to schedule (GitHub Actions outages).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Contabo VPS
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}
          OPENAI_ORG_ID: ${{ secrets.OPENAI_ORG_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          OPENAI_KEY_B64="$(printf '%s' "${OPENAI_API_KEY:-}" | base64 -w0)"
          OPENAI_MODEL_SAFE="${OPENAI_MODEL:-gpt-5.5}"
          OPENAI_PROJECT_SAFE="${OPENAI_PROJECT_ID:-}"
          OPENAI_ORG_SAFE="${OPENAI_ORG_ID:-}"
          GMAIL_CLIENT_ID_B64="$(printf '%s' "${GMAIL_CLIENT_ID:-}" | base64 -w0)"
          GMAIL_CLIENT_SECRET_B64="$(printf '%s' "${GMAIL_CLIENT_SECRET:-}" | base64 -w0)"
          PUBLIC_APP_URL_B64="$(printf '%s' "${PUBLIC_APP_URL:-}" | base64 -w0)"
          SMTP_B64="$(printf '%s\n%s\n%s\n%s\n%s' "${SMTP_HOST:-}" "${SMTP_PORT:-587}" "${SMTP_USER:-}" "${SMTP_PASS:-}" "${SMTP_FROM:-}" | base64 -w0)"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" \
            "OPENAI_KEY_B64='${OPENAI_KEY_B64}' OPENAI_MODEL_SAFE='${OPENAI_MODEL_SAFE}' OPENAI_PROJECT_SAFE='${OPENAI_PROJECT_SAFE}' OPENAI_ORG_SAFE='${OPENAI_ORG_SAFE}' GMAIL_CLIENT_ID_B64='${GMAIL_CLIENT_ID_B64}' GMAIL_CLIENT_SECRET_B64='${GMAIL_CLIENT_SECRET_B64}' PUBLIC_APP_URL_B64='${PUBLIC_APP_URL_B64}' SMTP_B64='${SMTP_B64}' bash -s" << 'EOF'
          set -euo pipefail
          cd /root/GreenLogistics-Attendance
          git fetch origin
          git reset --hard origin/main
          git rev-parse --short HEAD > deploy-version.txt
          rm -rf node_modules
          if ! npm ci; then
            echo "WARN: npm ci failed — retrying with npm install"
            rm -rf node_modules
            npm install --no-audit --no-fund
          fi

          # Sync schema to the canonical absolute SQLite path (or Postgres)
          npm run db:push
          node scripts/verify-email-schema.mjs

          # Persist absolute SQLite URL so PM2 always hits the same file
          DB_URL="$(grep -E '^DATABASE_URL=' .env | head -n1 | cut -d= -f2- | tr -d '"' | tr -d "'" || true)"
          if ! echo "${DB_URL:-}" | grep -qiE '^postgres(ql)?://'; then
            ABS_URL="file:$(pwd)/data/attendance.db"
            if grep -qE '^DATABASE_URL=' .env; then
              sed -i "s|^DATABASE_URL=.*|DATABASE_URL=\"${ABS_URL}\"|" .env
            else
              echo "DATABASE_URL=\"${ABS_URL}\"" >> .env
            fi
            echo "Pinned DATABASE_URL=${ABS_URL}"
          fi

          # GreenOS AI Assistant — sync OpenAI from GitHub Actions secrets (base64)
          touch .env
          if [ -n "${OPENAI_KEY_B64:-}" ]; then
            OPENAI_API_KEY="$(printf '%s' "$OPENAI_KEY_B64" | base64 -d | tr -d '\r\n')"
            MODEL="$(printf '%s' "${OPENAI_MODEL_SAFE:-gpt-5.5}" | tr -d '\r\n')"
            PROJECT="$(printf '%s' "${OPENAI_PROJECT_SAFE:-}" | tr -d '\r\n')"
            ORG="$(printf '%s' "${OPENAI_ORG_SAFE:-}" | tr -d '\r\n')"
            grep -vE '^(OPENAI_API_KEY|OPENAI_MODEL|OPENAI_PROJECT_ID|OPENAI_ORG_ID)=' .env > .env.openai.tmp || true
            printf 'OPENAI_API_KEY=%s\nOPENAI_MODEL=%s\nOPENAI_PROJECT_ID=%s\nOPENAI_ORG_ID=%s\n' \
              "$OPENAI_API_KEY" "$MODEL" "$PROJECT" "$ORG" >> .env.openai.tmp
            mv .env.openai.tmp .env
            echo "Synced OpenAI settings (key/model/project/org) to server .env"
          else
            echo "WARN: OPENAI_API_KEY GitHub secret is empty — AI Assistant will stay disabled"
          fi

          # Gmail OAuth — sync shared client credentials used by company and broker accounts
          if [ -n "${GMAIL_CLIENT_ID_B64:-}" ] && [ -n "${GMAIL_CLIENT_SECRET_B64:-}" ]; then
            GMAIL_CLIENT_ID="$(printf '%s' "$GMAIL_CLIENT_ID_B64" | base64 -d | tr -d '\r\n')"
            GMAIL_CLIENT_SECRET="$(printf '%s' "$GMAIL_CLIENT_SECRET_B64" | base64 -d | tr -d '\r\n')"
            PUBLIC_APP_URL="$(printf '%s' "${PUBLIC_APP_URL_B64:-}" | base64 -d | tr -d '\r\n')"
            PUBLIC_APP_URL="${PUBLIC_APP_URL:-https://os.greengrouplogistics.com}"
            GMAIL_REDIRECT_URI="${PUBLIC_APP_URL%/}/api/email/callback"
            grep -vE '^(GMAIL_CLIENT_ID|GMAIL_CLIENT_SECRET|PUBLIC_APP_URL|GMAIL_REDIRECT_URI)=' .env > .env.gmail.tmp || true
            printf 'GMAIL_CLIENT_ID=%s\nGMAIL_CLIENT_SECRET=%s\nPUBLIC_APP_URL=%s\nGMAIL_REDIRECT_URI=%s\n' \
              "$GMAIL_CLIENT_ID" "$GMAIL_CLIENT_SECRET" "$PUBLIC_APP_URL" "$GMAIL_REDIRECT_URI" >> .env.gmail.tmp
            mv .env.gmail.tmp .env
            echo "Synced Gmail OAuth configuration to server .env"
          else
            echo "WARN: Gmail OAuth GitHub secrets are empty"
          fi

          # Outbound corporate mailbox (review + system mail) — never stored in git.
          SMTP_PLAIN="$(printf '%s' "${SMTP_B64:-}" | base64 -d || true)"
          SMTP_HOST="$(printf '%s' "$SMTP_PLAIN" | sed -n '1p' | tr -d '\r')"
          SMTP_PORT="$(printf '%s' "$SMTP_PLAIN" | sed -n '2p' | tr -d '\r')"
          SMTP_USER="$(printf '%s' "$SMTP_PLAIN" | sed -n '3p' | tr -d '\r')"
          SMTP_PASS="$(printf '%s' "$SMTP_PLAIN" | sed -n '4p' | tr -d '\r')"
          SMTP_FROM="$(printf '%s' "$SMTP_PLAIN" | sed -n '5p' | tr -d '\r')"
          if [ -n "${SMTP_HOST:-}" ] && [ -n "${SMTP_USER:-}" ] && [ -n "${SMTP_PASS:-}" ]; then
            grep -vE '^(SMTP_HOST|SMTP_PORT|SMTP_USER|SMTP_PASS|SMTP_FROM)=' .env > .env.smtp.tmp || true
            printf 'SMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_USER=%s\nSMTP_PASS=%s\nSMTP_FROM=%s\n' \
              "$SMTP_HOST" "${SMTP_PORT:-587}" "$SMTP_USER" "$SMTP_PASS" "${SMTP_FROM:-$SMTP_USER}" >> .env.smtp.tmp
            mv .env.smtp.tmp .env
            echo "Synced SMTP configuration to server .env (user=${SMTP_USER})"
          else
            echo "WARN: SMTP GitHub secrets are empty — review emails cannot be sent"
          fi

          npm run build
          git rev-parse --short HEAD > frontend/public/deploy-version.txt
          chmod +x tools/pm2-greenos-env.sh
          install -m 755 tools/contabo-autodeploy/greenos-autodeploy.sh /usr/local/bin/greenos-autodeploy.sh 2>/dev/null || true
          # One PM2 process only — duplicate "greenos" entries caused stale env/code.
          pm2 delete greenos 2>/dev/null || true
          fuser -k 3847/tcp 2>/dev/null || true
          sleep 1
          # shellcheck disable=SC1091
          source ./tools/pm2-greenos-env.sh ./.env
          pm2 start dist/index.js --name greenos --update-env --cwd "$(pwd)"
          pm2 save
          echo "=== health poll (up to 90s) ==="
          HEALTH_JSON=""
          for i in $(seq 1 30); do
            if HEALTH_JSON="$(curl -sS -m 5 http://localhost:3847/api/health 2>/dev/null)"; then
              echo "$HEALTH_JSON"
              echo "health OK after ${i} attempt(s)"
              break
            fi
            sleep 3
          done
          if [ -z "$HEALTH_JSON" ]; then
            echo "health check never passed — recent pm2 logs:"
            pm2 logs greenos --lines 80 --nostream || true
            exit 1
          fi
          echo "$HEALTH_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); o=d.get('openai') or {}; assert o.get('model') and o.get('keySuffix'), f'health missing openai runtime: {d}'; print('openai_ok', o.get('model'), o.get('keySuffix'))"
          curl --fail http://localhost:3847/api/health
          EOF
