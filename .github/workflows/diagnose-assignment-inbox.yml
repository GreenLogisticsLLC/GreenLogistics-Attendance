name: Diagnose assignment + company Gmail

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Diagnose In Office eligibility and inbox health
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" bash -s << 'EOF'
          set -euo pipefail
          cd /root/GreenLogistics-Attendance
          git fetch origin
          git reset --hard origin/main
          npx tsc
          node --input-type=module << 'NODE'
          import { createRequire } from "module";
          const require = createRequire(import.meta.url);
          const { PrismaClient } = require("@prisma/client");
          const prisma = new PrismaClient();

          const workDate = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
          console.log("WORK_DATE_ET", workDate);

          const brokers = await prisma.user.findMany({
            where: { role: { roleName: "Broker" }, isActive: true },
            include: { employee: true, brokerGmailAccount: true },
            orderBy: [{ firstName: "asc" }, { lastName: "asc" }],
          });

          console.log("=== BROKER ATTENDANCE ===");
          for (const b of brokers) {
            const empId = b.employeeId || b.employee?.employeeId || null;
            const recent = empId
              ? await prisma.attendanceSession.findFirst({
                  where: {
                    employeeId: empId,
                    currentStatus: { in: ["INSIDE_OFFICE", "OUTSIDE_OFFICE", "SCHEDULED", "COMPLETED"] },
                  },
                  orderBy: { lastActivity: "desc" },
                })
              : null;
            const today = empId
              ? await prisma.attendanceSession.findUnique({
                  where: { employeeId_workDate: { employeeId: empId, workDate } },
                })
              : null;
            console.log({
              name: `${b.firstName} ${b.lastName}`,
              available: b.availableForAssignment,
              employeeId: empId,
              recentStatus: recent?.currentStatus || null,
              recentActivity: recent?.lastActivity || null,
              todayStatus: today?.currentStatus || null,
              gmail: b.brokerGmailAccount?.status || "NONE",
              gmailError: (b.brokerGmailAccount?.lastError || "").slice(0, 60) || null,
            });
          }

          const inside = await prisma.attendanceSession.findMany({
            where: { currentStatus: "INSIDE_OFFICE", workDate },
            include: { employee: { select: { firstName: true, lastName: true, employeeId: true } } },
          });
          console.log(
            "=== TODAY INSIDE_OFFICE ===",
            inside.map((s) => `${s.employee.firstName} ${s.employee.lastName}`)
          );

          const counts = await prisma.shipmentLead.groupBy({
            by: ["status"],
            where: {
              status: { in: ["NEW", "UNASSIGNED", "ASSIGNED", "AWAITING_ACCEPTANCE", "WORKING"] },
            },
            _count: { _all: true },
          });
          console.log("=== PIPELINE COUNTS ===", counts);

          const unassigned = await prisma.shipmentLead.count({
            where: {
              status: { in: ["NEW", "UNASSIGNED"] },
              OR: [{ assignedBrokerId: null }, { assignedBrokerId: "" }],
            },
          });
          console.log("UNASSIGNED_WAITING", unassigned);

          const gmailSetting = await prisma.setting.findUnique({
            where: { category_settingKey: { category: "gmail", settingKey: "refresh_token" } },
          });
          console.log("COMPANY_GMAIL_HAS_TOKEN", Boolean((gmailSetting?.settingValue || "").trim()));

          const recentImport = await prisma.shipmentImportLog.findMany({
            orderBy: { createdAt: "desc" },
            take: 8,
            select: { createdAt: true, processStatus: true, subject: true, fromAddress: true },
          });
          console.log("=== RECENT IMPORT LOGS ===");
          for (const r of recentImport) {
            console.log({
              at: r.createdAt,
              status: r.processStatus,
              from: r.fromAddress,
              subject: (r.subject || "").slice(0, 80),
            });
          }

          const queue = await prisma.assignmentQueueState.findUnique({ where: { queueKey: "brokers" } });
          console.log("QUEUE", queue);

          await prisma.$disconnect();
          NODE
          EOF
