name: Fix greenos 502

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Fast pull, build, restart
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" bash -s << 'EOF'
          set -euo pipefail
          cd /root/GreenLogistics-Attendance
          git fetch origin
          git reset --hard origin/main
          if ! npm ci; then
            echo "WARN: npm ci failed — retrying with npm install"
            rm -rf node_modules
            npm install --no-audit --no-fund
          fi
          npm run db:generate
          npm run build
          if ! pm2 restart greenos --update-env; then
            echo "pm2 restart failed — starting greenos"
            pm2 start dist/index.js --name greenos --update-env \
              || pm2 start npm --name greenos -- start
          fi
          pm2 save
          echo "=== HEAD ==="
          git rev-parse --short HEAD
          echo "=== pm2 ==="
          pm2 status
          echo "=== recent logs ==="
          pm2 logs greenos --lines 80 --nostream || true
          echo "=== health ==="
          # Boot takes longer than a few seconds — poll instead of failing on the first try.
          for i in $(seq 1 30); do
            if curl -sS -m 5 http://127.0.0.1:3847/api/health; then
              echo
              echo "health OK after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "health check never passed"
          pm2 logs greenos --lines 120 --nostream || true
          exit 1
          EOF
