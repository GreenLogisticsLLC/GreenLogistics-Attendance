name: Resend approval mail

on:
  workflow_dispatch:

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Install deps if needed and resend approvals
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" bash -s << 'EOF'
          set -euo pipefail
          cd /root/GreenLogistics-Attendance
          git fetch origin
          git checkout origin/main -- scripts/resend-approvals-on-server.mjs
          sed -i 's/^APPROVAL_EMAIL=.*/APPROVAL_EMAIL=effiegreenlogistics@gmail.com/' .env || echo 'APPROVAL_EMAIL=effiegreenlogistics@gmail.com' >> .env

          echo "Checking googleapis..."
          node -e "console.log(require.resolve('googleapis'))" || {
            echo "Installing dependencies..."
            npm ci
            npx prisma generate
          }

          node scripts/resend-approvals-on-server.mjs
          EOF
