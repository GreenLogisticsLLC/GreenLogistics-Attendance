name: Dump uShip email HTML

on:
  workflow_dispatch:
    inputs:
      gos:
        description: Green OS shipment ID
        required: true
        default: GOS1000550

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Dump email HTML fragments
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" \
            "GOS='${{ github.event.inputs.gos }}' bash -s" << 'EOF'
          set -euo pipefail
          cd /root/GreenLogistics-Attendance
          git fetch origin
          git reset --hard origin/main
          node scripts/dump-uship-email-html.mjs "${GOS:-GOS1000550}"
          EOF
