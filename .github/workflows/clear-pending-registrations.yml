name: Clear pending registrations

on:
  workflow_dispatch:

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Delete PENDING signup requests on Contabo
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" bash -s << 'EOF'
          set -euo pipefail
          cd /root/GreenLogistics-Attendance

          python3 << 'PY'
          import os, re, sqlite3
          from pathlib import Path

          root = Path("/root/GreenLogistics-Attendance")
          env = (root / ".env").read_text(encoding="utf-8", errors="ignore")
          m = re.search(r'^DATABASE_URL=(.*)$', env, re.M)
          raw = (m.group(1).strip().strip('"').strip("'") if m else "")
          candidates = []
          if raw.startswith("file:"):
              candidates.append(Path(raw[5:]))
          candidates += [
              root / "data" / "attendance.db",
              root / "prisma" / "data" / "attendance.db",
          ]
          db = next((p for p in candidates if p.is_file()), None)
          if not db:
              raise SystemExit("SQLite DB not found")

          print(f"Using DB={db}")
          con = sqlite3.connect(str(db))
          cur = con.cursor()
          rows = cur.execute(
              "SELECT username, email, requested_role, created_at FROM pending_registrations WHERE status='PENDING'"
          ).fetchall()
          print("PENDING before:", rows)
          cur.execute("DELETE FROM pending_registrations WHERE status='PENDING'")
          print(f"Deleted {cur.rowcount} PENDING registration(s).")
          con.commit()
          left = cur.execute(
              "SELECT COUNT(*) FROM pending_registrations WHERE status='PENDING'"
          ).fetchone()[0]
          print(f"PENDING after: {left}")
          con.close()
          PY
          EOF
