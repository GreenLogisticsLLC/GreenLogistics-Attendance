name: Clear pending registrations

on:
  workflow_dispatch:

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Delete PENDING signup requests on Contabo
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" << 'EOF'
          set -e
          cd /root/GreenLogistics-Attendance
          node --input-type=module <<'NODE'
          import { PrismaClient } from "@prisma/client";
          const prisma = new PrismaClient();
          const pending = await prisma.pendingRegistration.findMany({
            where: { status: "PENDING" },
            orderBy: { createdAt: "desc" },
          });
          console.log("Before:", pending.map((p) => ({
            username: p.username,
            email: p.email,
            role: p.requestedRole,
            createdAt: p.createdAt,
          })));
          const result = await prisma.pendingRegistration.deleteMany({
            where: { status: "PENDING" },
          });
          console.log("Deleted:", result.count);
          await prisma.$disconnect();
          NODE
          EOF
