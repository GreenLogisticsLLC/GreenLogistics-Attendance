name: Clear pending registrations

on:
  workflow_dispatch:

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Delete PENDING signup requests on Contabo
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" \
            'cd /root/GreenLogistics-Attendance && node -e "
              const { PrismaClient } = require(\"@prisma/client\");
              const prisma = new PrismaClient();
              (async () => {
                const pending = await prisma.pendingRegistration.findMany({ where: { status: \"PENDING\" } });
                console.log(\"Before:\", JSON.stringify(pending.map(p => ({ username: p.username, email: p.email, role: p.requestedRole })), null, 2));
                const result = await prisma.pendingRegistration.deleteMany({ where: { status: \"PENDING\" } });
                console.log(\"Deleted:\", result.count);
                await prisma.\$disconnect();
              })().catch(async (e) => { console.error(e); await prisma.\$disconnect(); process.exit(1); });
            "'
