name: Backfill uShip listing URL

on:
  workflow_dispatch:
    inputs:
      gos:
        description: Green OS shipment ID
        required: true
        default: GOS1000550

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Resolve listing on Contabo
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" \
            "GOS='${{ github.event.inputs.gos }}' bash -s" << 'EOF'
          set -euo pipefail
          mkdir -p /var/lock
          exec 9>/var/lock/greenos-autodeploy.lock
          flock 9
          cd /root/GreenLogistics-Attendance
          git fetch origin
          git reset --hard origin/main
          if [ ! -d node_modules/@prisma/client ] || [ ! -f dist/modules/crm/services/crm.service.js ] || [ ! -f node_modules/dotenv/package.json ]; then
            echo "Deps/build missing — installing and building first"
            if ! npm ci; then
              chmod -R u+w node_modules 2>/dev/null || true
              rm -rf node_modules 2>/dev/null || true
              if [ -e node_modules ]; then mv node_modules "node_modules.trash.$$" || true; fi
              npm install --no-audit --no-fund
            fi
            npm run db:generate
            npm run build
          fi
          node scripts/backfill-uship-listing.mjs "${GOS:-GOS1000550}"
          EOF
