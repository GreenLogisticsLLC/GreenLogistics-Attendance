name: Diagnose GL10241 ghost load

# Push-triggered because workflow_dispatch is blocked for the cloud agent token.
on:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "tools/ops/TRIGGER_GL10241_DIAGNOSE"
      - "scripts/diagnose-gl10241.mjs"
      - ".github/workflows/diagnose-gl10241-on-push.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Dump GL10241 provenance on Contabo
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" \
            "BRANCH='${BRANCH}' bash -s" << 'EOF'
          set -euo pipefail
          mkdir -p /var/lock
          exec 9>/var/lock/greenos-autodeploy.lock
          echo "Waiting for greenos deploy lock..."
          flock 9
          echo "Acquired greenos deploy lock"
          cd /root/GreenLogistics-Attendance
          git fetch origin
          # Prefer the branch that triggered this push when available.
          BR="${BRANCH:-main}"
          echo "Using branch: ${BR}"
          if git rev-parse --verify "origin/${BR}" >/dev/null 2>&1; then
            git reset --hard "origin/${BR}"
          else
            git reset --hard origin/main
          fi
          set -a
          # shellcheck disable=SC1091
          [ -f .env ] && . ./.env || true
          set +a
          if [ ! -d node_modules/@prisma/client ]; then
            echo "Deps missing — npm ci + generate"
            npm ci || npm install --no-audit --no-fund
            npm run db:generate
          fi
          node scripts/diagnose-gl10241.mjs GL10241
          EOF
